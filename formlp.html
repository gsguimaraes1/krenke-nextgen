<script>
(function() {
  var estadoEl = document.getElementById('form-field-estado');
  var cidadeEl = document.getElementById('form-field-cidade');
  if (!estadoEl || !cidadeEl) return;

  estadoEl.addEventListener('change', function() {
    var uf = this.value;
    if (!uf) return;
    cidadeEl.disabled = true;
    cidadeEl.innerHTML = '<option value="" disabled selected>Carregando...</option>';
    fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/' + uf + '/municipios?orderBy=nome')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        cidadeEl.innerHTML = '<option value="" disabled selected>Selecione a cidade</option>';
        data.forEach(function(m) {
          var opt = document.createElement('option');
          opt.value = m.nome;
          opt.textContent = m.nome;
          cidadeEl.appendChild(opt);
        });
        cidadeEl.disabled = false;
      })
      .catch(function() {
        cidadeEl.innerHTML = '<option value="" disabled selected>Erro ao carregar cidades</option>';
        cidadeEl.disabled = false;
      });
  });
})();
</script>
